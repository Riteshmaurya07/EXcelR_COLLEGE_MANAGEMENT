version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: college_cms_db
    restart: always
    environment:
      MYSQL_DATABASE: college_cms
      MYSQL_USER: cms_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-Cms9#AqhBlMEF9d0I4a}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootSecurePass123!}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_cms_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/college_cms?useSSL=false&serverTimezone=IST&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USERNAME: cms_user
      DB_PASSWORD: ${DB_PASSWORD:-Cms9#AqhBlMEF9d0I4a}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-299d40aad689741df814b8e01b466fd0ebfa397d37da356ed7729a9cd4c1be33c224c280}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
        VITE_SHOW_DEMO: "false"
    container_name: college_cms_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
